services:
  # --- Linux Host Setup (x86_64 or arm64 — Direct Hardware Access, X11 & Shared Memory) ---
  g1-dev-linux:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      network: host
    image: g1-humble-dev:latest
    container_name: g1_dev_linux
    entrypoint: [ "/usr/local/bin/g1-entrypoint.sh" ]
    network_mode: host                         # Shares host network namespace directly
    privileged: true                           # Grants root-level access for physical USB/Ethernet
    ipc: host                                  # Shares the host's IPC namespace for Zero-Copy /dev/shm
    environment:
      - DISPLAY=${DISPLAY:-}                 # Graphical UI forwarding
      - XAUTHORITY=/tmp/.docker.xauth
      - QT_X11_NO_MITSHM=1
      - HOME=/workspace
      - HISTFILE=/tmp/.bash_history
      - ROS_LOG_DIR=/tmp
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp  # Direct CycloneDDS integration for physical robot
      - CYCLONEDDS_URI=file:///workspace/config/cyclonedds_linux.xml
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw       # Mounts X11 server sockets
      - ${XAUTHORITY:-/tmp/.docker.xauth}:/tmp/.docker.xauth:ro
      - /dev/shm:/dev/shm:rw                   # Zero-copy memory map
      - .:/workspace                           # Mounts workspace directory
    command: [ "/bin/bash" ]
    stdin_open: true
    tty: true

  # --- Headless Build & Test Container (Linux x86_64/arm64 & macOS arm64 — no GUI or robot DDS) ---
  g1-dev-headless:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: g1-humble-dev:latest
    container_name: g1_dev_headless
    entrypoint: [ "/usr/local/bin/g1-entrypoint.sh" ]
    environment:
      - HOME=/workspace
      - HISTFILE=/tmp/.bash_history
      - ROS_LOG_DIR=/tmp
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - G1_HEADLESS=1
    volumes:
      - .:/workspace                           # Mounts workspace directory
    command: [ "/bin/bash" ]
    stdin_open: true
    tty: true

  g1_simulator:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    networks:
      - g1_sim_net
    environment:
      - HOME=/workspace
      - ROS_LOG_DIR=/tmp
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - G1_HEADLESS=1
    volumes:
      - ./src:/workspace/src
      - ./config:/workspace/config
    entrypoint: [ "/usr/local/bin/g1-entrypoint.sh" ]
    command: python3 /workspace/src/g1_cognitive_nodes/g1_cognitive_nodes/g1_mock_publisher.py

  g1_telemetry_listener:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    network_mode: host
    environment:
      - HOME=/workspace
      - ROS_LOG_DIR=/tmp
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///workspace/config/cyclonedds_linux.xml
    volumes:
      - ./src:/workspace/src
      - ./config:/workspace/config
    entrypoint: [ "/usr/local/bin/g1-entrypoint.sh" ]
    command: [ "ros2", "launch", "g1_cognitive_nodes", "g1_sim_visualisation.launch.py" ]

networks:
  g1_sim_net:
    driver: bridge
